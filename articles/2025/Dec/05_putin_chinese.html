    自 2022 年入侵烏克蘭以來，俄羅斯總統弗拉基米爾·普京首次訪問印度，並與印度總理納倫德拉·莫迪會面，以加強貿易和防務關係。儘管受到美國制裁，印度仍繼續購買俄羅斯石油，在壓力下拒絕譴責莫斯科，並將其立場描述為「通過對話實現和平」。此次會晤還包括關於進一步購買俄羅斯武器的討論，突顯了印度在戰爭期間對莫斯科持續的經濟和戰略支持。
